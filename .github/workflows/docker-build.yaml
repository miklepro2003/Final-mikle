name: Build and Push Docker Image # имя workflow, отображается на вкладке Actions
on: # триггер: когда запускать workflow
  push:
    branches:
      - main # при каждом push в ветку main
    paths: # запускать сборку только если изменились эти файлы
      - "app.py" # код приложения
      - "Dockerfile" # инструкция сборки образа
      - ".github/workflows/docker-build.yaml" # сам workflow
jobs: # список задач
  build-and-push: # имя задачи (job)
    runs-on: ubuntu-latest # публичный runner GitHub с Ubuntu и Docker
    steps: # шаги задачи, выполняются по порядку
      - name: Checkout source # 1: скачать код репозитория на runner
        uses: actions/checkout@v4
      - name: Set image tags # 2: получить короткий хеш коммита для тега
        id: vars # id нужен, чтобы читать результат в следующих шагах
        run: | # выполнить команду в оболочке runner
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub # 3: авторизация в Docker Hub
        uses: docker/login-action@v3 # готовое действие для docker login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }} # логин из Secrets
          password: ${{ secrets.DOCKERHUB_TOKEN }} # токен из Secrets
      - name: Build and Push # 4: собрать образ и отправить в Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/final-mikle:latest -t ${{ secrets.DOCKERHUB_USERNAME }}/final-mikle:${{ steps.vars.outputs.sha_short }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/final-mikle:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/final-mikle:${{ steps.vars.outputs.sha_short }}