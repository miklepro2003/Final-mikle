apiVersion: apps/v1 # версия API, в которой живёт ресурс Deployment
kind: Deployment # тип ресурса: следит, чтобы нужное число подов всегда работало

metadata: # данные о самом Deployment
  name: final-mikle # имя Deployment в кластере
  labels: # метки на самом Deployment, по ним удобно искать
    app: final-mikle # метка: это часть приложения final-mikle

spec:                                    # то, что мы хотим получить
  replicas: 2                        # сколько одинаковых подов держать запущенными
  selector:                           # как Deployment находит свои поды
    matchLabels:                 # своими считать только поды с такими метками
      app: final-mikle          # метка app=final-mikle, должна совпадать с меткой в шаблоне ниже

  template: # шаблон: по нему создаётся каждый под
    metadata: # данные о поде
      labels: # метки, которые получит каждый под
        app: final-mikle # по этой метке подов найдёт и Deployment, и Service
    spec: # описание самого пода
      containers: # список контейнеров в поде (у нас один)
        - name: final-mikle # имя контейнера внутри пода
          image: miklepro2003/final-mikle:e30ea12 # какой образ скачать из Docker Hub и запустить
          ports: # какие порты использует контейнер
            - containerPort: 8080 # приложение слушает порт 8080
          env: # переменные окружения для контейнера
            - name: PORT # имя переменной: app.py читает порт из PORT
              value: "8080" # значение переменной, в кавычках: значения env это всегда строки
          resources: # сколько ресурсов ноды нужно контейнеру
            requests: # минимум, который Kubernetes резервирует на ноде под этот контейнер
              cpu: 50m # 50 милли-ядер, то есть 5 процентов одного ядра
              memory: 64Mi # 64 мебибайта памяти, это примерно 67 МБ

          readinessProbe: # проверка готовности: когда под можно пускать трафик
            httpGet: # проверять запросом HTTP GET
              path: / # по адресу /
              port: 8080 # на порт 8080
            initialDelaySeconds: 3 # подождать 3 секунды после старта перед первой проверкой
            periodSeconds: 5 # дальше проверять каждые 5 секунд
